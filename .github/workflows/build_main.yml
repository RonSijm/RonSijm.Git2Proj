name: .NET
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore RonSijm.Git2Proj.slnx
      - name: Build Projects
        run: dotnet build RonSijm.Git2Proj.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test RonSijm.Git2Proj.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory:coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=lcov
      - name: Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          token: ${{secrets.CODECOV_TOKEN}}
          fail_ci_if_error: true
          verbose: true
      - name: Pack tool
        run: dotnet pack src/RonSijm.Git2Proj/RonSijm.Git2Proj.csproj --configuration Release --no-build --output ./packages
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git2proj-packages
          path: |
            packages/*.nupkg
            packages/*.snupkg
